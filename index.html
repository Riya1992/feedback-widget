<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>⭐ Rate this Runbook & Report Gaps</title>
  <meta property="og:title" content="Rate this article" />
  <meta name="twitter:title" content="Rate this article" />

  <!-- Supabase CDN (Keeps Supabase logging working directly from the browser) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      background: transparent;
    }
    .card {
      border: 1px solid #e1e4e8;
      border-radius: 8px;
      padding: 16px;
      background: #ffffff;
      max-width: 480px;
    }
    .radio-group label {
      margin-right: 15px;
      cursor: pointer;
    }
    .btn {
      padding: 8px 14px;
      border: none;
      border-radius: 6px;
      background: #0366d6;
      color: white;
      cursor: pointer;
    }
    .btn:disabled {
      background: #94d3a2;
      cursor: not-allowed;
    }
    .hidden {
      display: none;
    }
    .badge {
      background: #fff3cd;
      color: #856404;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
      margin-left: 6px;
    }
    .category-preview-box {
      margin: 10px 0;
      font-size: 13px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h3 style="margin-top: 0;">Submit Article Feedback</h3>
    <label><strong>Was this article helpful?</strong></label>

    <div class="radio-group" style="margin: 10px 0;">
      <label>
        <input type="radio" name="feedbackType" value="helpful" onchange="handleTypeChange()" />
        👍 Helpful
      </label>
      <label>
        <input type="radio" name="feedbackType" value="unhelpful" onchange="handleTypeChange()" />
        👎 Unhelpful
      </label>
    </div>

    <div id="optionsWrapper" class="hidden">
      <label id="optionsHeader" style="font-weight: bold; font-size: 13px;"></label>
      <div id="optionsContainer" class="checkbox-group"></div>
    </div>

    <div id="categoryDisplay" class="category-preview-box hidden">
      <strong>Auto-Triage Category:</strong>
      <span id="badge" class="badge"></span>
    </div>

    <div style="margin-top: 15px; display: flex; gap: 10px;">
      <button id="submitBtn" class="btn" onclick="submitFeedback()">Submit Feedback</button>
      <button class="btn" style="background:#666;" onclick="resetDefaults()">Reset</button>
    </div>
  </div>
  
  <script>
  // --- 1. CONFIGURATION ---
  const SUPABASE_URL = "https://sqznrekejcfhwakrfqzd.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNxem5yZWtlamNmaHdha3JmcXpkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU5ODQ1NDIsImV4cCI6MjEwMTU2MDU0Mn0.VZRx-L0NJm-b_XEluBe906nMtxDVtTimuT8K1VRiWKM";
  const FLOWISE_API_URL = "https://cloud.flowiseai.com/api/v1/prediction/36de5551-61db-4bbc-bf89-984896644bbb";

  // Initialize Supabase Client
  let supabaseClient = null;
  if (window.supabase && SUPABASE_URL.startsWith("http")) {
    supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  }

  // --- 2. 11 ISSUE CATEGORIES & MAPPINGS ---
  const issueCategories = [
    { label: "Is mostly correct", category: "Clarity" },
    { label: "Missing FAQ section", category: "Missing Information" },
    { label: "Poor formatting", category: "Formatting" },
    { label: "Has minor grammar problems", category: "Clarity" },
    { label: "Information is incorrect", category: "Accuracy" },
    { label: "Procedure does not work", category: "Accuracy" },
    { label: "Steps are missing", category: "Missing Information" },
    { label: "URL is wrong", category: "Accuracy" },
    { label: "Irrelevant information", category: "Clarity" },
    { label: "Steps are confusing", category: "Clarity" },
    { label: "Outdated information", category: "Outdated Content" }
  ];

  // --- 3. DYNAMIC CHECKBOX GENERATION & UI LOGIC ---
  function renderOptions() {
    const container = document.getElementById("optionsContainer");
    container.innerHTML = "";
    
    issueCategories.forEach((item) => {
      const labelEl = document.createElement("label");
      labelEl.style.display = "block";
      labelEl.style.margin = "4px 0";
      labelEl.style.fontSize = "13px";
      labelEl.style.cursor = "pointer";

      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.name = "issueOption";
      checkbox.value = item.label;
      checkbox.setAttribute("data-category", item.category);
      checkbox.onchange = updateAutoTriageBadge;

      labelEl.appendChild(checkbox);
      labelEl.appendChild(document.createTextNode(" " + item.label));
      container.appendChild(labelEl);
    });
  }

  function handleTypeChange() {
    const type = document.querySelector('input[name="feedbackType"]:checked')?.value;
    const optionsWrapper = document.getElementById("optionsWrapper");
    const optionsHeader = document.getElementById("optionsHeader");
    const display = document.getElementById("categoryDisplay");
    const badge = document.getElementById("badge");

    if (type === "unhelpful") {
      renderOptions();
      optionsHeader.innerText = "What went wrong with this article?";
      optionsWrapper.classList.remove("hidden");
      display.classList.remove("hidden");
      badge.innerText = "Needs Documentation Review";
    } else {
      optionsWrapper.classList.add("hidden");
      display.classList.add("hidden");
    }
  }

  function updateAutoTriageBadge() {
    const checkedBoxes = Array.from(document.querySelectorAll('input[name="issueOption"]:checked'));
    const badge = document.getElementById("badge");

    if (checkedBoxes.length === 0) {
      badge.innerText = "Needs Documentation Review";
      return;
    }

    // Extract unique triage categories from selected checkboxes
    const categories = [...new Set(checkedBoxes.map(cb => cb.getAttribute("data-category")))];
    badge.innerText = categories.join(" & ");
  }

  function resetDefaults() {
    document.querySelectorAll('input[name="feedbackType"]').forEach(el => el.checked = false);
    document.getElementById("optionsWrapper").classList.add("hidden");
    document.getElementById("categoryDisplay").classList.add("hidden");
    const submitBtn = document.getElementById("submitBtn");
    submitBtn.disabled = false;
    submitBtn.innerText = "Submit Feedback";
  }

  // --- 4. SUBMISSION HANDLER WITH FLOWISE & SUPABASE PAYLOAD ---
  async function submitFeedback() {
    const submitBtn = document.getElementById("submitBtn");
    const feedbackType = document.querySelector('input[name="feedbackType"]:checked')?.value;

    if (!feedbackType) {
      alert("Please select whether the article was helpful or unhelpful.");
      return;
    }

    // Collect all checked checkbox values
    const selectedIssues = Array.from(document.querySelectorAll('input[name="issueOption"]:checked'))
      .map(cb => cb.value);

    // Derive triage categories
    const categories = feedbackType === "unhelpful" && selectedIssues.length > 0
      ? [...new Set(selectedIssues.map(issue => {
          const found = issueCategories.find(item => item.label === issue);
          return found ? found.category : "Needs Review";
        }))].join(", ")
      : feedbackType === "unhelpful" ? "Needs Documentation Review" : "Positive Feedback";

    submitBtn.disabled = true;
    submitBtn.innerText = "Submitting...";

    // 1. Capture the actual GitBook article URL and parse its title
    const gitbookUrl = document.referrer || window.location.href;
    let articleTitle = "General Runbook";
    try {
      if (document.referrer) {
        const urlObj = new URL(document.referrer);
        const pathSegments = urlObj.pathname.split("/").filter(Boolean);
        if (pathSegments.length > 0) {
          articleTitle = pathSegments[pathSegments.length - 1]
            .replace(/-/g, " ")
            .replace(/\b\w/g, char => char.toUpperCase());
        }
      }
    } catch (e) {
      articleTitle = document.title;
    }

    const issuesSummary = selectedIssues.length > 0 ? selectedIssues.join(", ") : "None specified";
    const sentiment = feedbackType === "helpful" ? "positive" : "negative";

    // 2. Diagnostic payload sent to Flowise Agent
    const flowisePrompt = `[Documentation Feedback Incident]
Article Title: ${articleTitle}
Page URL: ${gitbookUrl}
Feedback Type: ${feedbackType}
Feedback Sentiment: ${sentiment}
Selected Issues: ${issuesSummary}
Auto-Triage Category: ${categories}`;

    try {
      // Step A: Send to Supabase table (public.kb_feedback)
      if (supabaseClient) {
        const { error: dbError } = await supabaseClient
          .from("kb_feedback")
          .insert([{ 
            comment: issuesSummary,
            feedback_type: feedbackType,
            feedback_sentiment: sentiment,
            triage_status: "Pending_Triage",
            severity_score: feedbackType === "helpful" ? 0 : 6
          }]);

        if (dbError) {
          console.error("Supabase Database Insert Error:", dbError);
          throw dbError;
        }
      }

      // Step B: Send to Flowise Agent
      if (FLOWISE_API_URL.startsWith("http")) {
        const flowiseResponse = await fetch(FLOWISE_API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            question: flowisePrompt
          })
        });

        if (!flowiseResponse.ok) {
          console.warn("Flowise API HTTP Status:", flowiseResponse.status);
        }
      }

      alert("Thank you! Feedback received successfully.");
      resetDefaults();

    } catch (err) {
      console.error("Submission error:", err);
      alert("Feedback failed to submit. Please check browser console for details.");
      submitBtn.disabled = false;
      submitBtn.innerText = "Submit Feedback";
    }
  }
</script>
</body>
</html>
